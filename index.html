<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>น้ำขิงคนเดียว</title>
  <style>
    @keyframes float {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-15px); }
    }

    @font-face {
      font-family: 'Layiji SaRangHeYo';
      src: url('LayijiSarangheyo.ttf') format('truetype');
    }

    body {
      background: linear-gradient(180deg, #ffb4ff 0%, #ff78c8 100%);
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
      overflow: hidden;
      position: relative;
    }

    .name {
      text-align: center;
      color: white;
      background-color: rgb(255, 0, 136);
      padding: 5px 15px;
      border-radius: 10px;
      font-size: 2.2rem;
      box-shadow: 0 4px 10px rgba(0,0,0,0.2);
      animation: float 3s ease-in-out infinite;
      font-family: "Layiji SaRangHeYo", sans-serif;
      transition: background-color 0.2s;
      margin-bottom: 20px;
      z-index: 1;
    }

    .name:hover {
      background-color: rgb(232, 3, 125);
    }

    .button {
      text-decoration: none;
      text-align: center;
      color: white;
      background-color: rgb(255, 49, 159);
      padding: 5px 15px;
      border-radius: 10px;
      font-size: 2.2rem;
      box-shadow: 0 4px 10px rgba(0,0,0,0.2);
      font-family: "Layiji SaRangHeYo", sans-serif;
      margin-bottom: 20px;
      z-index: 1;
      transition: background-color 0.2s, transform 0.2s;
    }
    .button:hover {
      background-color: rgb(253, 8, 139);
      transform: scale(1.05);
    }


    strong { color: rgb(158, 5, 5); }
    h2, h3 { margin: -10px; }

    .hearts-bg {
      position: fixed;
      inset: 0;
      overflow: hidden;
      pointer-events: none;
      z-index: 0;
    }

    .heart {
      position: absolute;
      top: -10vh;
      color: #ff1e90;
      opacity: 0;
      font-size: 24px;
      animation: fall linear forwards;
    }

    @keyframes fall {
      0% {
        transform: translateY(-10vh);
        opacity: 0;
      }
      10% {
        opacity: 0.9;
      }
      90% {
        opacity: 0.1;
      }
      100% {
        transform: translateY(110vh);
        opacity: 0;
      }
    }

    img {
       vertical-align: middle;
    }
    
  </style>
</head>
<body>
  <div class="hearts-bg" aria-hidden="true"></div>

  <h1 class="name">💖 น้ำขิง 💖<br>น่ารักมากก</h1>
  <a href="http://stampkhing.love/namkhing" target="_blank" class="button"><img src="https://upload.wikimedia.org/wikipedia/commons/a/a5/Instagram_icon.png" 
       alt="Instagram" width="32" height="32" class="ig-logo"><h2"> IG น้ำขิง<strong>แฟนแสตมป์</strong></h2></a>
  <a href="http://stampkhing.love/stamp" target="_blank" class="button"><img src="https://upload.wikimedia.org/wikipedia/commons/a/a5/Instagram_icon.png" 
       alt="Instagram" width="32" height="32" class="ig-logo"><h3"> IG แสตมป์<strong>แฟนน้ำขิง</strong></h3></a>

  <script>
    const container = document.querySelector('.hearts-bg');
    const emojis = ['❤️', '💖', '💕', '💘', '💞'];
    const total = 25;

    function createHeart() {
      const heart = document.createElement('div');
      heart.className = 'heart';
      heart.textContent = emojis[Math.floor(Math.random() * emojis.length)];
      
      heart.style.left = Math.random() * 100 + 'vw';
      
      const size = Math.random() * 20 + 20;
      heart.style.fontSize = size + 'px';
      
      const duration = Math.random() * 5 + 5
      heart.style.animationDuration = duration + 's';
      
      heart.style.animationDelay = Math.random() * 3 + 's';
      
      heart.style.opacity = Math.random() * 0.5 + 0.5;
      
      container.appendChild(heart);
    
      setTimeout(() => heart.remove(), (duration + 3) * 1000);
    }

    setInterval(() => {
      for (let i = 0; i < total / 5; i++) {
        createHeart();
      }
    }, 300);
  </script>
</body>
</html>
